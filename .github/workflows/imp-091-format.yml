name: IMP-091 formatter

on:
  push:
    branches:
      - agent/imp-091

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-091
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Apply repository Ruff rules
        shell: bash
        run: |
          uv run ruff check --fix src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py
          uv run ruff format src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py
          rm .github/workflows/imp-091-format.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py .github/workflows/imp-091-format.yml
          git commit -m "IMP-091: apply repository formatting"
          git push origin HEAD:agent/imp-091
