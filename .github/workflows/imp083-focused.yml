name: IMP-083 focused validation

on:
  push:
    branches:
      - imp-083-lite-client-resource-measurement

permissions:
  contents: write

jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp-083-lite-client-resource-measurement
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run ruff format src/doll/lite_measurement.py tests/test_imp_083_lite_client_measurement.py scripts/run_imp_083_lite_client_measurement.py
      - run: uv run ruff check --fix src/doll/lite_measurement.py tests/test_imp_083_lite_client_measurement.py scripts/run_imp_083_lite_client_measurement.py
      - run: uv run ruff check src/doll/lite_measurement.py tests/test_imp_083_lite_client_measurement.py scripts/run_imp_083_lite_client_measurement.py
      - run: uv run mypy src/doll/lite_measurement.py tests/test_imp_083_lite_client_measurement.py scripts/run_imp_083_lite_client_measurement.py
      - run: uv run pytest -q --no-cov tests/test_imp_083_lite_client_measurement.py
      - name: Run synthetic evidence runner
        shell: bash
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          uv run python scripts/run_imp_083_lite_client_measurement.py --commit-sha "$COMMIT_SHA" --evidence-level ci > imp083.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("imp083.json").read_text(encoding="utf-8"))
          assert payload["result"] == "pass"
          assert all(payload["checks"].values())
          assert not any(payload["privacy"].values())
          PY
      - name: Commit formatting if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doll/lite_measurement.py tests/test_imp_083_lite_client_measurement.py scripts/run_imp_083_lite_client_measurement.py
          git diff --cached --quiet && exit 0
          git commit -m "Format IMP-083 measurement harness"
          git push origin HEAD:imp-083-lite-client-resource-measurement
