name: WEB-012 public-writing sync

on:
  push:
    branches:
      - agent/web-012-memory-comparison
    paths:
      - .github/workflows/web-012-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/web-012-memory-comparison
      - name: Sync writing metadata and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          catalog_entry = '''  Object.freeze({
            id: "portable-memory-not-ai-continuity",
            kind: "official",
            title: "Portable Memory Is Not AI Continuity: PAM, PLUR, PROJECTMEM, and doll",
            path: "/notes/portable-memory-not-ai-continuity/",
            description: "A design comparison of PAM, PLUR, PROJECTMEM, and doll across memory interchange, retrieval dynamics, project experience, authority, and deterministic pre-action continuity checks.",
            summary: "Why portable memory, retrieval state, project experience, and continuity authority should interoperate without collapsing into one memory model.",
            published: "2026-08-16",
            related: Object.freeze(["ai-memory-portability-continuity", "access-is-not-continuity", "frontier-ai-infrastructure"]),
            externalVersions: Object.freeze([]),
          }),
'''
          replace_once(
              "website/src/writing-catalog.js",
              "export const OFFICIAL_NOTES = Object.freeze([\n",
              "export const OFFICIAL_NOTES = Object.freeze([\n" + catalog_entry,
              "catalog entry",
          )
          replace_once(
              "website/src/writing-catalog.js",
              '    related: Object.freeze(["frontier-ai-infrastructure", "access-is-not-continuity", "ai-access-national-policy", "permissioned-ai-access", "ai-will-remain"]),\n',
              '    related: Object.freeze(["portable-memory-not-ai-continuity", "frontier-ai-infrastructure", "access-is-not-continuity", "ai-access-national-policy", "permissioned-ai-access", "ai-will-remain"]),\n',
              "previous-note related writing",
          )

          writing_entry = '''      <article class="writing-entry" data-writing-id="portable-memory-not-ai-continuity">
            <p class="writing-date">
              Published: <time datetime="2026-08-16">2026-08-16</time>
            </p>
            <h3><a href="../notes/portable-memory-not-ai-continuity/">Portable Memory Is Not AI Continuity: PAM, PLUR, PROJECTMEM, and doll</a></h3>
            <p>
              Why portable memory, retrieval state, project experience, and continuity authority should interoperate without collapsing into one memory model.
            </p>
            <p><a href="../notes/portable-memory-not-ai-continuity/">Read note</a></p>
          </article>

'''
          replace_once(
              "website/writing/index.html",
              '      <article class="writing-entry" data-writing-id="ai-memory-portability-continuity">\n',
              writing_entry + '      <article class="writing-entry" data-writing-id="ai-memory-portability-continuity">\n',
              "writing index",
          )

          note_entry = '''        <li>
              <a href="./portable-memory-not-ai-continuity/">Portable Memory Is Not AI Continuity: PAM, PLUR, PROJECTMEM, and doll</a>
              <br><time datetime="2026-08-16">August 16, 2026</time>
            </li>
'''
          replace_once(
              "website/notes/index.html",
              '        <li>\n          <a href="./ai-memory-portability-continuity/">AI Memory Is Becoming Portable. Continuity Still Isn\'t.</a>\n',
              note_entry + '        <li>\n          <a href="./ai-memory-portability-continuity/">AI Memory Is Becoming Portable. Continuity Still Isn\'t.</a>\n',
              "notes index",
          )

          url = "https://doll.badjoke-lab.com/notes/portable-memory-not-ai-continuity/"
          previous = "https://doll.badjoke-lab.com/notes/ai-memory-portability-continuity/"
          replace_once(
              "website/llms.txt",
              f"- Official note: {previous}\n",
              f"- Official note: {url}\n- Official note: {previous}\n",
              "llms discovery",
          )
          replace_once(
              "website/ai.txt",
              previous + "\n",
              url + "\n" + previous + "\n",
              "ai discovery",
          )

          sitemap = "website/sitemap.xml"
          replace_once(sitemap, "<lastmod>2026-08-13</lastmod>", "<lastmod>2026-08-16</lastmod>", "root lastmod")
          replace_once(sitemap, "<lastmod>2026-08-12</lastmod>", "<lastmod>2026-08-16</lastmod>", "writing lastmod")
          replace_once(sitemap, "<lastmod>2026-08-13</lastmod>", "<lastmod>2026-08-16</lastmod>", "notes lastmod")
          new_url = '''  <url>
            <loc>https://doll.badjoke-lab.com/notes/portable-memory-not-ai-continuity/</loc>
            <lastmod>2026-08-16</lastmod>
          </url>
'''
          replace_once(
              sitemap,
              '  <url>\n    <loc>https://doll.badjoke-lab.com/notes/ai-memory-portability-continuity/</loc>\n',
              new_url + '  <url>\n    <loc>https://doll.badjoke-lab.com/notes/ai-memory-portability-continuity/</loc>\n',
              "sitemap article",
          )
          PY
          node scripts/check-public-writing.mjs
          node scripts/check-public-site-status.mjs
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse("website/sitemap.xml")
          html = Path("website/notes/portable-memory-not-ai-continuity/index.html").read_text(encoding="utf-8")
          required = [
              "<h1>Portable Memory Is Not AI Continuity: PAM, PLUR, PROJECTMEM, and doll</h1>",
              "https://portable-ai-memory.org/spec/v1.0/",
              "https://plur.ai/spec.html",
              "https://arxiv.org/abs/2606.12329",
              "https://github.com/riponcm/projectmem",
              "https://github.com/badjoke-lab/doll/blob/main/src/doll/continuity_preflight.py",
          ]
          missing = [value for value in required if value not in html]
          if missing:
              raise SystemExit(f"WEB-012 article is missing required content: {missing}")
          PY
          rm .github/workflows/web-012-sync.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add website/src/writing-catalog.js website/writing/index.html website/notes/index.html website/llms.txt website/ai.txt website/sitemap.xml website/notes/portable-memory-not-ai-continuity/index.html .github/workflows/web-012-sync.yml
          git commit -m "WEB-012: register continuity comparison note"
          git push origin HEAD:agent/web-012-memory-comparison
