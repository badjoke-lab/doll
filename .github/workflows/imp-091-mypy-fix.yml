name: IMP-091 mypy fix

on:
  push:
    branches:
      - agent/imp-091

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-091
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Apply type-only fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          once(
              "src/doll/pam_v1_import.py",
              '                    tuple(item["id"] for item in relations),\n',
              '                    tuple(cast(str, item["id"]) for item in relations),\n',
          )
          once(
              "tests/test_imp_091_pam_v1_import.py",
              '    PamV1ImportError,\n    PamV1ImportStager,\n',
              '    PamV1ImportError,\n    PamV1ImportStageResult,\n    PamV1ImportStager,\n',
          )
          once(
              "tests/test_imp_091_pam_v1_import.py",
              '    memory = {\n',
              '    memory: dict[str, object] = {\n',
          )
          once(
              "tests/test_imp_091_pam_v1_import.py",
              'def _stage(source_bytes: bytes):\n',
              'def _stage(source_bytes: bytes) -> PamV1ImportStageResult:\n',
          )
          once(
              "tests/test_imp_091_pam_v1_import_edges.py",
              'def _stage(source: bytes, **limits: int):\n',
              'def _stage(source: bytes, **limits: int) -> pam.PamV1ImportStageResult:\n',
          )
          once(
              "tests/test_imp_091_pam_v1_import_edges.py",
              '''    invalid_cases = [
        {"source_sha256": "bad"},
        {"generic_projection_sha256": "bad"},
        {"source_size_bytes": 0},
        {"schema_version": "2.0"},
        {"adapter_id": "other"},
        {"adapter_version": "2.0.0"},
        {"verified_content_hash_count": 0},
    ]
    for changes in invalid_cases:
        with pytest.raises(pam.PamV1ImportError):
            replace(valid, **changes)
''',
              '''    with pytest.raises(pam.PamV1ImportError):
        replace(valid, source_sha256="bad")
    with pytest.raises(pam.PamV1ImportError):
        replace(valid, generic_projection_sha256="bad")
    with pytest.raises(pam.PamV1ImportError):
        replace(valid, source_size_bytes=0)
    with pytest.raises(pam.PamV1ImportError):
        replace(valid, schema_version="2.0")
    with pytest.raises(pam.PamV1ImportError):
        replace(valid, adapter_id="other")
    with pytest.raises(pam.PamV1ImportError):
        replace(valid, adapter_version="2.0.0")
    with pytest.raises(pam.PamV1ImportError):
        replace(valid, verified_content_hash_count=0)
''',
          )
          PY
          uv run ruff check --fix --select I src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py
          uv run ruff format src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py
          uv run ruff check src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py
          uv run mypy src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py
          rm .github/workflows/imp-091-mypy-fix.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py .github/workflows/imp-091-mypy-fix.yml
          git commit -m "IMP-091: satisfy strict type checks"
          git push origin HEAD:agent/imp-091
