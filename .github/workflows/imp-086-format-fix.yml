name: IMP-086 exact formatting pass

on:
  push:
    branches:
      - agent/imp-086-memory-lexical-index

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-086-memory-lexical-index
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Apply known lint fixes and repository formatter
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/doll/recall_index.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '        raise RecallIndexValidationError("workspace identity and Doll State revision are inconsistent")': '        raise RecallIndexValidationError(\n            "workspace identity and Doll State revision are inconsistent"\n        )',
              '            raise RecallIndexUnavailableError("memory lexical index directory could not be created") from exc': '            raise RecallIndexUnavailableError(\n                "memory lexical index directory could not be created"\n            ) from exc',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one lint anchor: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          doc = Path("docs/implementation/imp-086-optional-rebuildable-memory-lexical-index.md")
          doc_text = doc.read_text(encoding="utf-8")
          doc_text = doc_text.replace("\n token_postings\n", "\ntoken_postings\n", 1)
          doc.write_text(doc_text, encoding="utf-8")
      - name: Ruff format and autofix
        run: |
          uv run ruff format src/doll/recall_index.py tests/test_imp_086_memory_lexical_index.py tests/test_imp_086_memory_lexical_index_fail_closed.py
          uv run ruff check --fix src/doll/recall_index.py tests/test_imp_086_memory_lexical_index.py tests/test_imp_086_memory_lexical_index_fail_closed.py
          uv run ruff format src/doll/recall_index.py tests/test_imp_086_memory_lexical_index.py tests/test_imp_086_memory_lexical_index_fail_closed.py
          uv run ruff check src/doll/recall_index.py tests/test_imp_086_memory_lexical_index.py tests/test_imp_086_memory_lexical_index_fail_closed.py
      - name: Commit exact formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "badjoke-lab"
          git config user.email "badjoke.lab@gmail.com"
          git add src/doll/recall_index.py tests/test_imp_086_memory_lexical_index.py tests/test_imp_086_memory_lexical_index_fail_closed.py docs/implementation/imp-086-optional-rebuildable-memory-lexical-index.md
          git commit -m "IMP-086: apply exact Ruff formatting"
          git push origin HEAD:agent/imp-086-memory-lexical-index
