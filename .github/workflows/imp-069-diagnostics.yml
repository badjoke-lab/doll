name: IMP-069 diagnostics

on:
  pull_request:
    paths:
      - src/doll/local_work_proposal.py
      - tests/test_imp_069_local_work_proposal.py
      - .github/workflows/imp-069-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.event.pull_request.number == 222
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Apply bounded fixes in runner
        run: |
          python - <<'EXTRACT'
          from pathlib import Path

          workflow = Path(".github/workflows/imp-069-fix.yml").read_text(
              encoding="utf-8"
          )
          marker = "python - <<'PY'\n"
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(source, "imp-069-embedded-fix", "exec"), {})
          EXTRACT
      - name: Capture formatter
        run: uv run ruff format src/doll/local_work_proposal.py tests/test_imp_069_local_work_proposal.py > imp-069-format-apply.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: imp-069-applied-files
          path: |
            src/doll/local_work_proposal.py
            tests/test_imp_069_local_work_proposal.py
            imp-069-format-apply.log
          if-no-files-found: error
