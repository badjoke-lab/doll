name: IMP-069 diagnostics

on:
  pull_request:
    paths:
      - src/doll/local_work_proposal.py
      - tests/test_imp_069_local_work_proposal.py
      - .github/workflows/imp-069-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.event.pull_request.number == 222
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Apply bounded fixes
        run: |
          python - <<'EXTRACT'
          from pathlib import Path

          workflow = Path(".github/workflows/imp-069-fix.yml").read_text(
              encoding="utf-8"
          )
          marker = "python - <<'PY'\n"
          if workflow.count(marker) != 1:
              raise SystemExit("embedded fix block is unavailable")
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          source = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(source, "imp-069-embedded-fix", "exec"), {})
          EXTRACT
      - run: uv run ruff format src/doll/local_work_proposal.py tests/test_imp_069_local_work_proposal.py
      - run: uv run ruff check src/doll/local_work_proposal.py tests/test_imp_069_local_work_proposal.py
      - run: uv run mypy src/doll/local_work_proposal.py tests/test_imp_069_local_work_proposal.py
      - run: uv run pytest --no-cov tests/test_imp_069_local_work_proposal.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doll/local_work_proposal.py tests/test_imp_069_local_work_proposal.py
          git diff --cached --check
          git commit -m "Harden IMP-069 validation and coverage"
          git push origin HEAD:${GITHUB_HEAD_REF}
