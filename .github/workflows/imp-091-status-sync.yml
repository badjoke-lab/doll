name: IMP-091 status sync

on:
  push:
    branches:
      - agent/imp-091-status

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-091-status
          fetch-depth: 0
      - name: Apply bounded status replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          status_path = "website/project-status.json"
          replace_once(status_path, '"next_implementation": 91', '"next_implementation": 92')
          replace_once(status_path, "Phase 6 is in progress through IMP-090.", "Phase 6 is in progress through IMP-091.")
          replace_once(
              status_path,
              "and a review-only memory consolidation candidate detector are implemented.",
              "a review-only memory consolidation candidate detector, and an offline PAM v1.0 staged memory import adapter are implemented.",
          )
          imp090 = "IMP-090 adds a deterministic read-only consolidation-candidate detector over active non-secret confirmed memories. It reports exact duplicates, lexical near-duplicates, compatible extensions, and existing explicit contradiction links for review using versioned normalization and lexical overlap rules. Candidate output is advisory and non-persistent, and detection does not merge, archive, supersede, update, or otherwise change authoritative MemoryRecord state automatically."
          imp091 = "IMP-091 adds an offline PAM v1.0 staged memory import adapter. It validates caller-provided memory-store JSON bytes without network access, verifies required PAM content hashes using PAM normalization, preserves the exact source SHA-256 plus source memory IDs and provenance, and projects each memory into the existing generic staged-import boundary as external_data. PAM lifecycle, access, confidence, instruction type, relations, embedding references, integrity, signatures, owner, and conversation-index data remain non-authoritative source metadata or explicit mapping notes. It does not create confirmed MemoryRecords, local permissions, policies, work completion, instruction authority, model behavior, embeddings, network access, or PAM export."
          replace_once(status_path, imp090, imp090 + " " + imp091)
          replace_once(
              status_path,
              "project-aware memory selection, PAM/PLUR/PROJECTMEM adapters, ProjectExperienceRecord",
              "project-aware memory selection, reviewed PAM publication/export, PLUR/PROJECTMEM adapters, ProjectExperienceRecord",
          )
          replace_once(status_path, '"last_reviewed": "2026-08-13"', '"last_reviewed": "2026-08-14"')

          checker = "scripts/check-public-site-status.mjs"
          replace_once(checker, "status.phase?.next_implementation === 91,", "status.phase?.next_implementation === 92,")
          replace_once(
              checker,
              '"project-status.json must mark Phase 6 in progress through IMP-090 with IMP-091 next"',
              '"project-status.json must mark Phase 6 in progress through IMP-091 with IMP-092 next"',
          )
          replace_once(
              checker,
              'status.model_runtime.message.includes("through IMP-090") &&',
              'status.model_runtime.message.includes("through IMP-091") &&',
          )
          anchor = '    status.model_runtime.message.includes("does not merge, archive, supersede, update") &&\n'
          added = (
              '    status.model_runtime.message.includes("offline PAM v1.0 staged memory import adapter") &&\n'
              '    status.model_runtime.message.includes("caller-provided memory-store JSON bytes") &&\n'
              '    status.model_runtime.message.includes("verifies required PAM content hashes") &&\n'
              '    status.model_runtime.message.includes("exact source SHA-256") &&\n'
              '    status.model_runtime.message.includes("generic staged-import boundary as external_data") &&\n'
              '    status.model_runtime.message.includes("non-authoritative source metadata") &&\n'
              '    status.model_runtime.message.includes("does not create confirmed MemoryRecords") &&\n'
              '    status.model_runtime.message.includes("reviewed PAM publication/export") &&\n'
          )
          replace_once(checker, anchor, anchor + added)
          replace_once(
              checker,
              '"project-status.json must describe IMP-090 while preserving bounded IMP-083 through IMP-089 evidence and non-claims"',
              '"project-status.json must describe IMP-091 while preserving bounded IMP-083 through IMP-090 evidence and non-claims"',
          )
          PY
          rm .github/workflows/imp-091-status-sync.yml
          node scripts/check-public-site-status.mjs
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add website/project-status.json scripts/check-public-site-status.mjs .github/workflows/imp-091-status-sync.yml
          git commit -m "Sync public status through IMP-091"
          git push origin HEAD:agent/imp-091-status
