name: IMP-093 preparation

on:
  push:
    branches:
      - agent/imp-093
    paths:
      - .github/workflows/imp-093-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-093
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Sync AGENTS and validate IMP-093 slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          text = path.read_text()
          old = 'IMP-001 through IMP-023 and IMP-030 through IMP-092 are complete on this implementation branch'
          new = 'IMP-001 through IMP-023 and IMP-030 through IMP-093 are complete on this implementation branch'
          if text.count(old) != 1:
              raise SystemExit(f'completion frontier replacement count: {text.count(old)}')
          text = text.replace(old, new)

          anchor = '- IMP-092 adds only explicit candidate-by-candidate PAM memory review and publication. Read-only previews bind the exact source and current state to an approve/reject plan hash; only a user-controlled approve may create a normal approved-import MemoryRecord, unchanged repeated approval reuses it, rejection writes nothing, and PAM lifecycle/access/confidence/relations/instruction/embedding metadata remain non-authoritative.\n'
          addition = '- IMP-093 adds only bounded offline PAM v1.0 confirmed-memory export. It exports an explicit caller-selected set of active non-secret MemoryRecords under an explicit caller-supplied PAM owner id, preserves Doll record identity separately from PAM content hashing, emits deterministic required PAM fields plus out-of-band mapping/loss evidence, and validates the produced bytes through the existing offline PAM stager; it does not add automatic workspace export, relation/lifecycle/access conversion, embeddings, signatures, model/cloud/network behavior, or complete Doll continuity export.\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'IMP-092 anchor count: {text.count(anchor)}')
          text = text.replace(anchor, anchor + addition)

          old_tail = '- Persistent memory-use signals, supported/default semantic retrieval, persistent embeddings, hybrid fusion, automatic context injection, PAM export, PLUR/PROJECTMEM adapters, ProjectExperienceRecord, ContinuityPreflight, MCP, cloud expansion, and State Package signing are not established by IMP-092 and must follow their accepted specification, safety, portability, usefulness-evidence, and acceptance boundaries.\n'
          new_tail = '- Persistent memory-use signals, supported/default semantic retrieval, persistent embeddings, hybrid fusion, automatic context injection, PLUR/PROJECTMEM adapters, ProjectExperienceRecord, ContinuityPreflight, MCP, cloud expansion, and State Package signing are not established by IMP-093 and must follow their accepted specification, safety, portability, usefulness-evidence, and acceptance boundaries.\n'
          if text.count(old_tail) != 1:
              raise SystemExit(f'frontier tail replacement count: {text.count(old_tail)}')
          path.write_text(text.replace(old_tail, new_tail))
          PY
          uv run ruff check --fix src/doll/pam_v1_export.py tests/test_imp_093_pam_v1_export.py
          uv run ruff format src/doll/pam_v1_export.py tests/test_imp_093_pam_v1_export.py
          uv run ruff check src/doll/pam_v1_export.py tests/test_imp_093_pam_v1_export.py
          uv run mypy src/doll/pam_v1_export.py tests/test_imp_093_pam_v1_export.py
          uv run pytest -q --no-cov tests/test_imp_093_pam_v1_export.py
          rm .github/workflows/imp-093-prep.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add AGENTS.md src/doll/pam_v1_export.py tests/test_imp_093_pam_v1_export.py .github/workflows/imp-093-prep.yml
          git commit -m "IMP-093: prepare bounded PAM export slice"
          git push origin HEAD:agent/imp-093
