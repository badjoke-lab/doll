name: IMP-069 completion

on:
  pull_request:
    paths:
      - scripts/apply_imp_069_completion.py
      - .github/workflows/imp-069-completion.yml

permissions:
  contents: write

jobs:
  complete:
    if: github.event.pull_request.number == 222
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python scripts/apply_imp_069_completion.py
      - run: uv run ruff format src/doll/local_work_proposal.py tests/test_imp_069_local_work_proposal.py
      - run: uv run ruff check src/doll/local_work_proposal.py tests/test_imp_069_local_work_proposal.py
      - run: uv run mypy src/doll/local_work_proposal.py tests/test_imp_069_local_work_proposal.py
      - run: uv run pytest --no-cov tests/test_imp_069_local_work_proposal.py
      - run: uv run python scripts/build_final_spec.py
      - run: node scripts/check-public-site-status.mjs
      - name: Commit completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/doll/local_work_proposal.py \
            tests/test_imp_069_local_work_proposal.py \
            docs/implementation/imp-069-local-work-item-proposal.md \
            docs/spec/09-development-roadmap.md \
            docs/testing/phase-6-daily-use-matrix.json \
            website/project-status.json \
            scripts/check-public-site-status.mjs \
            DOLL_FINAL_SPEC.md
          git diff --cached --check
          git commit -m "Record IMP-069 proposal CI status"
          git push origin HEAD:${GITHUB_HEAD_REF}
