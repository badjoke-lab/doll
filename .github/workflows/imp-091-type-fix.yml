name: IMP-091 type fix

on:
  push:
    branches:
      - agent/imp-091

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-091
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Apply type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/doll/pam_v1_import.py": [
                  ('tuple(item["id"] for item in relations)', 'tuple(cast(str, item["id"]) for item in relations)'),
              ],
              "tests/test_imp_091_pam_v1_import.py": [
                  ('    PamV1ImportError,\n    PamV1ImportStager,', '    PamV1ImportError,\n    PamV1ImportStageResult,\n    PamV1ImportStager,'),
                  ('    memory = {', '    memory: dict[str, object] = {'),
                  ('def _stage(source_bytes: bytes):', 'def _stage(source_bytes: bytes) -> PamV1ImportStageResult:'),
              ],
              "tests/test_imp_091_pam_v1_import_edges.py": [
                  ('def _stage(source: bytes, **limits: int):', 'def _stage(source: bytes, **limits: int) -> pam.PamV1ImportStageResult:'),
                  ('            replace(valid, **changes)', '            replace(valid, **changes)  # type: ignore[arg-type]'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"{filename}: expected one match for {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          uv run ruff check --fix --select I src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py
          uv run ruff format src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py
          uv run ruff check src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py
          uv run mypy src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py
          rm .github/workflows/imp-091-type-fix.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/doll/pam_v1_import.py tests/test_imp_091_pam_v1_import.py tests/test_imp_091_pam_v1_import_edges.py .github/workflows/imp-091-type-fix.yml
          git commit -m "IMP-091: satisfy strict type checks"
          git push origin HEAD:agent/imp-091
