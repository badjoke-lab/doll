name: IMP-086 Windows fsync fix

on:
  push:
    branches:
      - agent/imp-086-memory-lexical-index

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-086-memory-lexical-index
      - name: Patch cross-platform fsync descriptor mode
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/doll/recall_index.py")
          text = path.read_text(encoding="utf-8")
          old = 'flags = os.O_RDONLY | cast(int, getattr(os, "O_BINARY", 0))'
          new = 'flags = os.O_RDWR | cast(int, getattr(os, "O_BINARY", 0))'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one fsync flag anchor")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit fix
        run: |
          git config user.name "badjoke-lab"
          git config user.email "badjoke.lab@gmail.com"
          git add src/doll/recall_index.py
          git commit -m "IMP-086: fix Windows fsync descriptor mode"
          git push origin HEAD:agent/imp-086-memory-lexical-index
