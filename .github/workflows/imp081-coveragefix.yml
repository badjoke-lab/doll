name: IMP-081 coverage fix

on:
  push:
    branches:
      - imp-081-csv-writing-attachment

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp-081-csv-writing-attachment
      - name: Add CSV option shape acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_imp_081_csv_writing_attachment.py")
          text = path.read_text(encoding="utf-8")
          marker = "        assert adapter.prompts == []\n        assert _origin_count(repository) == before\n\n\ndef test_target_preflight_happens_before_csv_read_and_transform_error_creates_no_origin(\n"
          addition = '''        with pytest.raises(\n            LocalWritingWorkflowValidationError, match="delimiter profile is invalid"\n        ):\n            service.execute(\n                mode="revise",\n                conversation_id=conversation_id,\n                scope_type="conversation",\n                scope_key="writing",\n                request_text="Revise.",\n                source_csv_path=csv_path,\n                source_csv_delimiter_profile=cast(str, 1),\n                operation_id="imp081.invalid.delimiter.type",\n            )\n        with pytest.raises(\n            LocalWritingWorkflowValidationError, match="selected columns are invalid"\n        ):\n            service.execute(\n                mode="revise",\n                conversation_id=conversation_id,\n                scope_type="conversation",\n                scope_key="writing",\n                request_text="Revise.",\n                source_csv_path=csv_path,\n                source_csv_selected_columns=cast(Sequence[str], "name"),\n                operation_id="imp081.invalid.columns.string",\n            )\n        with pytest.raises(\n            LocalWritingWorkflowValidationError, match="header renames are invalid"\n        ):\n            service.execute(\n                mode="revise",\n                conversation_id=conversation_id,\n                scope_type="conversation",\n                scope_key="writing",\n                request_text="Revise.",\n                source_csv_path=csv_path,\n                source_csv_header_renames=cast(Mapping[str, str], (("name", "title"),)),\n                operation_id="imp081.invalid.renames.shape",\n            )\n\n        assert adapter.prompts == []\n        assert _origin_count(repository) == before\n\n\ndef test_target_preflight_happens_before_csv_read_and_transform_error_creates_no_origin(\n'''
          if marker not in text:
              raise SystemExit("coverage insertion marker missing")
          path.write_text(text.replace(marker, addition, 1), encoding="utf-8")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run ruff format tests/test_imp_081_csv_writing_attachment.py
      - run: uv run ruff check tests/test_imp_081_csv_writing_attachment.py
      - run: uv run mypy tests/test_imp_081_csv_writing_attachment.py
      - name: Commit acceptance coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_imp_081_csv_writing_attachment.py
          git diff --cached --quiet && exit 0
          git commit -m "Cover IMP-081 CSV option edge cases"
          git push origin HEAD:imp-081-csv-writing-attachment
