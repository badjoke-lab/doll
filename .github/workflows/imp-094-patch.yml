name: IMP-094 patch validation

on:
  push:
    branches:
      - agent/imp-094
    paths:
      - .github/workflows/imp-094-patch.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-094
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Apply bounded validation fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/doll/project_experience.py")
          t = p.read_text(encoding="utf-8")
          old = '    _reject_secret_link(record, sensitivity, "superseded experience")\n    prior = _project_experience_from_record(record, None)\n'
          new = '    _reject_secret_link(record, sensitivity, "superseded experience")\n    if record.record_type != "project_experience":\n        raise ProjectExperienceValidationError(\n            "superseded experience points to another record type"\n        )\n    prior = _project_experience_from_record(record, None)\n'
          if t.count(old) != 1:
              raise SystemExit(f"supersedes anchor count: {t.count(old)}")
          p.write_text(t.replace(old, new), encoding="utf-8")

          p = Path("tests/test_imp_094_project_experience_validation.py")
          t = p.read_text(encoding="utf-8")
          t = t.replace("service.list(limit=bad_limit)  # type: ignore[arg-type]", "service.list(limit=bad_limit)")
          t = t.replace('_ids("ids", valid_uuid)  # type: ignore[arg-type]', '_ids("ids", valid_uuid)')
          p.write_text(t, encoding="utf-8")
          PY
          uv run ruff format src/doll/project_experience.py tests/test_imp_094_project_experience_validation.py
          uv run ruff check --fix src/doll/project_experience.py tests/test_imp_094_project_experience_validation.py
          uv run mypy src/doll/project_experience.py tests/test_imp_094_project_experience_validation.py
          uv run pytest --no-cov -q tests/test_imp_094_project_experience.py tests/test_imp_094_project_experience_validation.py
          uv run pytest -q
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/doll/project_experience.py tests/test_imp_094_project_experience_validation.py
          git commit -m "IMP-094: harden ProjectExperienceRecord validation coverage"
          git push origin HEAD:agent/imp-094
