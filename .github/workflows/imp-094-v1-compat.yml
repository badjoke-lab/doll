name: IMP-094 v1 compatibility fix

on:
  push:
    branches:
      - agent/imp-094
    paths:
      - .github/workflows/imp-094-v1-compat.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-094
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Update v1 compatibility fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for file_name in (
              'tests/project_continuity_support.py',
              'tests/test_state_package_v2.py',
          ):
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              member_anchor = '        "records/conversation-events.jsonl",\n'
              if text.count(member_anchor) != 1:
                  raise SystemExit(f'{file_name}: member anchor count {text.count(member_anchor)}')
              text = text.replace(
                  member_anchor,
                  member_anchor + '        "records/project-experiences.jsonl",\n',
              )
              type_anchor = '        "conversation_event",\n'
              if text.count(type_anchor) != 1:
                  raise SystemExit(f'{file_name}: type anchor count {text.count(type_anchor)}')
              text = text.replace(
                  type_anchor,
                  type_anchor + '        "project_experience",\n',
              )
              path.write_text(text, encoding='utf-8')
          PY
          uv run ruff format tests/project_continuity_support.py tests/test_state_package_v2.py tests/test_state_package_registry.py
          uv run ruff check tests/project_continuity_support.py tests/test_state_package_v2.py tests/test_state_package_registry.py
          uv run pytest --no-cov -q \
            tests/test_project_continuity_transfer.py::test_supported_v1_project_import_does_not_fabricate_continuity_children \
            tests/test_state_package_v2.py::test_supported_v1_fixture_inspects_plans_and_imports \
            tests/test_state_package_registry.py::test_supported_registries_are_explicit_and_immutable
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add tests/project_continuity_support.py tests/test_state_package_v2.py tests/test_state_package_registry.py
          git commit -m 'IMP-094: preserve State Package v1 fixture compatibility'
          git push origin HEAD:agent/imp-094
