name: IMP-071 apply integration

on:
  pull_request:
    paths:
      - src/doll/local_failure_guidance.py
      - tests/test_imp_071_local_failure_guidance.py
      - scripts/apply_imp_071_runtime_guidance.py
      - .github/workflows/imp-071-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 226
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run python scripts/apply_imp_071_runtime_guidance.py
      - run: >-
          uv run ruff format
          src/doll/local_failure_guidance.py
          src/doll/local_conversation.py
          tests/test_imp_071_local_failure_guidance.py
          tests/test_local_conversation.py
      - run: >-
          uv run ruff check
          src/doll/local_failure_guidance.py
          src/doll/local_conversation.py
          tests/test_imp_071_local_failure_guidance.py
          tests/test_local_conversation.py
      - run: uv run mypy src
      - run: >-
          uv run pytest --no-cov
          tests/test_imp_071_local_failure_guidance.py
          tests/test_local_conversation.py
      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doll/local_failure_guidance.py src/doll/local_conversation.py tests/test_imp_071_local_failure_guidance.py tests/test_local_conversation.py
          git diff --cached --check
          git commit -m "Integrate IMP-071 local runtime guidance"
          git push origin HEAD:${GITHUB_HEAD_REF}
