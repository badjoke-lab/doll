name: IMP-094 coverage validation

on:
  push:
    branches:
      - agent/imp-094
    paths:
      - .github/workflows/imp-094-coverage.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-094
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Format, type-check, focused-test, and measure full coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_imp_094_project_experience_validation.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'service.list(limit=bad_limit)  # type: ignore[arg-type]': 'service.list(limit=bad_limit)',
              '_ids("ids", valid_uuid)  # type: ignore[arg-type]': '_ids("ids", valid_uuid)',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'typing cleanup anchor count for {old!r}: {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff format tests/test_imp_094_project_experience_validation.py
          uv run ruff check --fix tests/test_imp_094_project_experience_validation.py
          uv run mypy tests/test_imp_094_project_experience_validation.py
          uv run pytest --no-cov -q tests/test_imp_094_project_experience.py tests/test_imp_094_project_experience_validation.py
          uv run pytest -q
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          if ! git diff --quiet -- tests/test_imp_094_project_experience_validation.py; then
            git add tests/test_imp_094_project_experience_validation.py
            git commit -m 'IMP-094: format ProjectExperienceRecord validation coverage'
            git push origin HEAD:agent/imp-094
          fi
