name: IMP-085 status patch

on:
  push:
    branches:
      - agent/public-status-imp-085

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-status-imp-085
      - name: Patch merged IMP-085 status only
        shell: python
        run: |
          import json
          from pathlib import Path

          status_path = Path("website/project-status.json")
          checker_path = Path("scripts/check-public-site-status.mjs")

          status = json.loads(status_path.read_text(encoding="utf-8"))
          if status["phase"]["next_implementation"] == 86 and "through IMP-085" in status["model_runtime"]["message"]:
              raise SystemExit(0)
          if status["phase"]["next_implementation"] != 85 or "through IMP-084" not in status["model_runtime"]["message"]:
              raise SystemExit("unexpected public status frontier")

          status["phase"]["next_implementation"] = 86
          message = status["model_runtime"]["message"]
          message = message.replace(
              "Phase 6 is in progress through IMP-084.",
              "Phase 6 is in progress through IMP-085.",
              1,
          )
          anchor = (
              "IMP-084 derives recall output from the accepted non-secret IMP-073 memory search surface, "
              "binds results to authoritative MemoryRecord and Doll State revisions, exposes explicit "
              "algorithm/version identity and deterministic ranking, and passes MCON-001/MCON-002 without "
              "a persistent recall record, usage signal, embedding, model call, network path, or authoritative "
              "memory mutation."
          )
          addition = (
              " IMP-085 makes the version-1 weighted-memory-fields policy the default RecallState ranking over "
              "the same active, non-secret IMP-073 candidate surface, using inspectable deterministic weighted "
              "lexical scoring across subject, content, metadata-only fallback evidence, and exact-phrase bonuses; "
              "existing IMP-084 algorithms remain available for rollback, and no persistent recall record, usage "
              "signal, index, embedding, model call, network path, automatic context injection, or authoritative "
              "memory mutation is introduced."
          )
          if message.count(anchor) != 1:
              raise SystemExit("IMP-084 status anchor missing or duplicated")
          status["model_runtime"]["message"] = message.replace(anchor, anchor + addition, 1)
          status_path.write_text(json.dumps(status, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          checker = checker_path.read_text(encoding="utf-8")
          replacements = {
              "status.phase?.next_implementation === 85,": "status.phase?.next_implementation === 86,",
              '"project-status.json must mark Phase 6 in progress through IMP-084 with IMP-085 next",': '"project-status.json must mark Phase 6 in progress through IMP-085 with IMP-086 next",',
              'status.model_runtime.message.includes("through IMP-084") &&': 'status.model_runtime.message.includes("through IMP-085") &&',
              'status.model_runtime.message.includes("MCON-001/MCON-002") &&': 'status.model_runtime.message.includes("MCON-001/MCON-002") &&\n    status.model_runtime.message.includes("weighted-memory-fields") &&\n    status.model_runtime.message.includes("deterministic weighted lexical scoring") &&\n    status.model_runtime.message.includes("active, non-secret IMP-073 candidate surface") &&\n    status.model_runtime.message.includes("existing IMP-084 algorithms remain available for rollback") &&',
              '"project-status.json must describe IMP-084 while preserving bounded IMP-083 evidence and non-claims",': '"project-status.json must describe IMP-085 while preserving bounded IMP-083/IMP-084 evidence and non-claims",',
          }
          for old, new in replacements.items():
              if checker.count(old) != 1:
                  raise SystemExit(f"checker anchor count != 1: {old}")
              checker = checker.replace(old, new, 1)
          checker_path.write_text(checker, encoding="utf-8")
      - name: Commit patched status
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "badjoke-lab"
          git config user.email "badjoke.lab@gmail.com"
          git add website/project-status.json scripts/check-public-site-status.mjs
          git commit -m "Update public status through IMP-085"
          git push origin HEAD:agent/public-status-imp-085
