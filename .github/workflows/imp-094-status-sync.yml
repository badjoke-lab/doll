name: IMP-094 status sync

on:
  push:
    branches:
      - agent/imp-094-status-sync
    paths:
      - .github/workflows/imp-094-status-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-094-status-sync
      - name: Advance public status through IMP-094
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          status = Path("website/project-status.json")
          replace_once(status, '"next_implementation": 94', '"next_implementation": 95', "next implementation")
          replace_once(status, 'Phase 6 is in progress through IMP-093.', 'Phase 6 is in progress through IMP-094.', "frontier")
          anchor = (
              'The result is explicitly PAM memory interchange rather than a Doll State Package or complete continuity export, '
              'and IMP-093 does not add automatic workspace export, relation/lifecycle/access conversion, embeddings, '
              'integrity/signature blocks, model behavior, cloud behavior, or network access. '
          )
          paragraph = (
              'IMP-094 adds version-1 append-oriented ProjectExperienceRecord semantic work history with observation, hypothesis, '
              'attempt, outcome, resolution, and lesson event kinds; explicit user/system/import/model assertion and provenance '
              'classes; validated project, optional work-item, evidence, source, related-record, and supersession links; and '
              'correction through a linked replacement rather than silent semantic rewrite. It participates in State Package '
              'export/import, backup/restore, compatibility, and fresh-process inspection through the existing authoritative-record '
              'boundary, while Resume Bundle v1 reports deterministic omission instead of silently changing its payload contract. '
              'Project experience does not change ProjectRecord scope, complete or reopen WorkItems, create DecisionRecords, approve '
              'procedures/checkpoints, grant policy/permission/capability authority, or make imported/model-proposed claims trusted. '
              'MCON-009 is covered, including a failed attempt and later resolution, while experience-aware action blocking remains '
              'out of scope until ContinuityPreflight. '
          )
          replace_once(status, anchor, anchor + paragraph, "IMP-094 status paragraph")
          replace_once(status, 'PLUR/PROJECTMEM adapters, ProjectExperienceRecord, ContinuityPreflight, MCP,', 'PLUR/PROJECTMEM adapters, ContinuityPreflight, MCP,', "remove completed project experience")
          replace_once(status, '"last_reviewed": "2026-08-15"', '"last_reviewed": "2026-08-16"', "review date")

          checker = Path("scripts/check-public-site-status.mjs")
          replace_once(checker, 'status.phase?.next_implementation === 94,', 'status.phase?.next_implementation === 95,', "checker next implementation")
          replace_once(checker, '"project-status.json must mark Phase 6 in progress through IMP-093 with IMP-094 next",', '"project-status.json must mark Phase 6 in progress through IMP-094 with IMP-095 next",', "checker frontier message")
          replace_once(checker, 'status.model_runtime.message.includes("through IMP-093") &&', 'status.model_runtime.message.includes("through IMP-094") &&', "checker runtime frontier")
          pam_anchor = '    status.model_runtime.message.includes("does not add automatic workspace export") &&\n'
          imp094_checks = (
              '    status.model_runtime.message.includes("version-1 append-oriented ProjectExperienceRecord") &&\n'
              '    status.model_runtime.message.includes("attempt, outcome, resolution, and lesson") &&\n'
              '    status.model_runtime.message.includes("explicit user/system/import/model assertion and provenance") &&\n'
              '    status.model_runtime.message.includes("linked replacement rather than silent semantic rewrite") &&\n'
              '    status.model_runtime.message.includes("State Package export/import, backup/restore, compatibility, and fresh-process inspection") &&\n'
              '    status.model_runtime.message.includes("Resume Bundle v1 reports deterministic omission") &&\n'
              '    status.model_runtime.message.includes("does not change ProjectRecord scope") &&\n'
              '    status.model_runtime.message.includes("MCON-009") &&\n'
              '    status.model_runtime.message.includes("experience-aware action blocking remains out of scope until ContinuityPreflight") &&\n'
          )
          replace_once(checker, pam_anchor, pam_anchor + imp094_checks, "checker IMP-094 assertions")
          replace_once(checker, '"project-status.json must describe IMP-093 while preserving bounded IMP-083 through IMP-092 evidence and non-claims",', '"project-status.json must describe IMP-094 while preserving bounded IMP-083 through IMP-093 evidence and non-claims",', "checker description")
          PY
          node scripts/check-public-site-status.mjs
          rm .github/workflows/imp-094-status-sync.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add website/project-status.json scripts/check-public-site-status.mjs .github/workflows/imp-094-status-sync.yml
          git commit -m "Sync public status through IMP-094"
          git push origin HEAD:agent/imp-094-status-sync
