name: IMP-095 validation

on:
  push:
    branches:
      - agent/imp-095
    paths:
      - .github/workflows/imp-095-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-095
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Sync IMP-095 frontier and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          agents = Path("AGENTS.md")
          replace_once(
              agents,
              "IMP-001 through IMP-023 and IMP-030 through IMP-094 are complete on this implementation branch; IMP-024 through IMP-029 are retired and must not be reused.",
              "IMP-001 through IMP-023 and IMP-030 through IMP-095 are complete on this implementation branch; IMP-024 through IMP-029 are retired and must not be reused.",
              "AGENTS implementation frontier",
          )
          imp094 = (
              "- IMP-094 adds the first bounded ProjectExperienceRecord continuity foundation. It records append-oriented semantic work history with explicit assertion/provenance classes, linked correction through `supersedes_id`, package/backup/restore/fresh-process continuity, and deterministic Resume Bundle v1 omission reporting. It does not mutate current project/work/decision/policy/permission/checkpoint authority, store secret content in ordinary Doll State, or add ContinuityPreflight, PROJECTMEM, PLUR, MCP, automatic extraction, warnings, or action blocking.\n"
          )
          imp095 = (
              "- IMP-095 adds the first bounded deterministic ContinuityPreflight read model. It requires read-only state, composes explicit applicable policy denials, current WorkItem blockers/dependencies, required Procedure state, immutable capability risk/release metadata, PermissionRecord decisions, and directly relevant unsuperseded failed ProjectExperienceRecord warnings into explainable rule codes and record IDs. It never grants permission, executes a capability, interprets policy prose, mutates Doll State, or lets imported/model-proposed experience create a hard deny; Capability Broker execution authority remains unchanged.\n"
          )
          replace_once(agents, imp094, imp094 + imp095, "AGENTS IMP-095 bullet")
          replace_once(
              agents,
              "Persistent memory-use signals, supported/default semantic retrieval, persistent embeddings, hybrid fusion, automatic context injection, PLUR/PROJECTMEM adapters, ContinuityPreflight, MCP, cloud expansion, and State Package signing are not established by IMP-094",
              "Persistent memory-use signals, supported/default semantic retrieval, persistent embeddings, hybrid fusion, automatic context injection, PLUR/PROJECTMEM adapters, MCP, cloud expansion, and State Package signing are not established by IMP-095",
              "AGENTS remaining nonclaims",
          )
          PY
          uv run ruff check --fix src/doll/continuity_preflight.py tests/test_imp_095_continuity_preflight.py
          uv run ruff format src/doll/continuity_preflight.py tests/test_imp_095_continuity_preflight.py
          uv run mypy src/doll/continuity_preflight.py
          uv run pytest --no-cov -q tests/test_imp_095_continuity_preflight.py tests/test_imp_094_project_experience.py tests/test_capabilities.py
          uv run pytest -q tests/test_imp_095_continuity_preflight.py --cov=doll.continuity_preflight --cov-report=term-missing --cov-fail-under=95
          rm .github/workflows/imp-095-validate.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add AGENTS.md src/doll/continuity_preflight.py tests/test_imp_095_continuity_preflight.py docs/implementation/imp-095-continuity-preflight.md .github/workflows/imp-095-validate.yml
          git commit -m "IMP-095: validate bounded ContinuityPreflight"
          git push origin HEAD:agent/imp-095
