name: IMP-081 status integration

on:
  push:
    branches:
      - imp-081-csv-writing-attachment

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp-081-csv-writing-attachment
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Integrate IMP-081 status and controlled spec source
        run: python .github/imp081_status_integrate.py
      - name: Extend public status checker for IMP-081
        run: python .github/imp081_status_checker_fix.py
      - name: Rebuild generated final specification
        run: uv run python scripts/build_final_spec.py
      - name: Verify generated specification
        run: uv run python scripts/build_final_spec.py --check
      - name: Verify public status
        run: node scripts/check-public-site-status.mjs
      - name: Commit integrated status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/project-status.json docs/testing/phase-6-daily-use-matrix.json docs/spec/09-development-roadmap.md scripts/check-public-site-status.mjs DOLL_FINAL_SPEC.md
          git diff --cached --quiet && exit 0
          git commit -m "Integrate IMP-081 status and specification"
          git push origin HEAD:imp-081-csv-writing-attachment
