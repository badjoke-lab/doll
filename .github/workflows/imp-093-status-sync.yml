name: IMP-093 status sync

on:
  push:
    branches:
      - agent/imp-093-status
    paths:
      - .github/workflows/imp-093-status-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-093-status
      - name: Sync public status through IMP-093
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path('website/project-status.json')
          checker_path = Path('scripts/check-public-site-status.mjs')
          status = status_path.read_text()
          checker = checker_path.read_text()

          status_replacements = [
              ('"next_implementation": 93', '"next_implementation": 94'),
              ('Phase 6 is in progress through IMP-092.', 'Phase 6 is in progress through IMP-093.'),
              (
                  'IMP-092 does not add automatic approval, implicit batch approval, PAM export, model behavior, cloud behavior, or network access. PDF OCR/scanned-PDF fallback',
                  'IMP-092 does not add automatic approval, implicit batch approval, PAM export, model behavior, cloud behavior, or network access. IMP-093 adds bounded offline PAM v1.0 confirmed-memory export for an explicit caller-selected set of active non-secret MemoryRecords under an explicit caller-supplied PAM owner id. It emits deterministic required PAM fields, reuses the IMP-091 content-hash normalization, preserves Doll record identity separately from PAM content hashing, returns explicit mapping/loss evidence, round-trips emitted bytes through the existing offline PAM stager, and leaves Doll State unchanged even from a fresh read-only repository. Secret or archived memories, invalid or duplicate selections, unsupported target versions, and unavailable IDs fail closed. The result is explicitly PAM memory interchange rather than a Doll State Package or complete continuity export, and IMP-093 does not add automatic workspace export, relation/lifecycle/access conversion, embeddings, integrity/signature blocks, model behavior, cloud behavior, or network access. PDF OCR/scanned-PDF fallback',
              ),
              ('project-aware memory selection, PAM export, PLUR/PROJECTMEM adapters', 'project-aware memory selection, PLUR/PROJECTMEM adapters'),
          ]
          for old, new in status_replacements:
              if status.count(old) != 1:
                  raise SystemExit(f'status replacement count for {old!r}: {status.count(old)}')
              status = status.replace(old, new)

          checker_replacements = [
              ('status.phase?.next_implementation === 93', 'status.phase?.next_implementation === 94'),
              ('Phase 6 in progress through IMP-092 with IMP-093 next', 'Phase 6 in progress through IMP-093 with IMP-094 next'),
              ('status.model_runtime.message.includes("through IMP-092")', 'status.model_runtime.message.includes("through IMP-093")'),
              ('status.model_runtime.message.includes("PAM export") &&\n    status.model_runtime.message.includes("automatic/model-selected context injection")', 'status.model_runtime.message.includes("automatic/model-selected context injection")'),
              ('project-status.json must describe IMP-092 while preserving bounded IMP-083 through IMP-091 evidence and non-claims', 'project-status.json must describe IMP-093 while preserving bounded IMP-083 through IMP-092 evidence and non-claims'),
          ]
          for old, new in checker_replacements:
              if checker.count(old) != 1:
                  raise SystemExit(f'checker replacement count for {old!r}: {checker.count(old)}')
              checker = checker.replace(old, new)

          anchor = '    status.model_runtime.message.includes("does not add automatic approval") &&\n'
          addition = (
              '    status.model_runtime.message.includes("bounded offline PAM v1.0 confirmed-memory export") &&\n'
              '    status.model_runtime.message.includes("explicit caller-selected set of active non-secret MemoryRecords") &&\n'
              '    status.model_runtime.message.includes("explicit caller-supplied PAM owner id") &&\n'
              '    status.model_runtime.message.includes("preserves Doll record identity separately from PAM content hashing") &&\n'
              '    status.model_runtime.message.includes("round-trips emitted bytes through the existing offline PAM stager") &&\n'
              '    status.model_runtime.message.includes("fresh read-only repository") &&\n'
              '    status.model_runtime.message.includes("Secret or archived memories") &&\n'
              '    status.model_runtime.message.includes("PAM memory interchange rather than a Doll State Package") &&\n'
              '    status.model_runtime.message.includes("does not add automatic workspace export") &&\n'
          )
          if checker.count(anchor) != 1:
              raise SystemExit(f'checker anchor count: {checker.count(anchor)}')
          checker = checker.replace(anchor, anchor + addition)

          status_path.write_text(status)
          checker_path.write_text(checker)
          PY
          node scripts/check-public-site-status.mjs
          rm .github/workflows/imp-093-status-sync.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add website/project-status.json scripts/check-public-site-status.mjs .github/workflows/imp-093-status-sync.yml
          git commit -m "Sync public status through IMP-093"
          git push origin HEAD:agent/imp-093-status
