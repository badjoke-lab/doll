name: Publish DEV article

on:
  workflow_dispatch:
    inputs:
      article:
        description: Markdown article under docs/writing/dev
        required: true
        default: docs/writing/dev/portable-memory-not-ai-continuity.md
        type: string
      publish:
        description: Publish immediately instead of creating a draft
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - docs/writing/dev/three-ai-outages-multi-provider-not-continuity.md

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require DEV API key
        shell: bash
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          test -n "$DEVTO_API_KEY" || {
            echo 'DEVTO_API_KEY repository secret is required.' >&2
            exit 2
          }
      - name: Create DEV article
        shell: bash
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          ARTICLE_PATH: ${{ github.event_name == 'push' && 'docs/writing/dev/three-ai-outages-multi-provider-not-continuity.md' || inputs.article }}
          PUBLISH_NOW: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
        run: |
          args=(--article "$ARTICLE_PATH")
          if [[ "$PUBLISH_NOW" == "true" ]]; then
            args+=(--publish)
          fi
          python scripts/publish_dev_article.py "${args[@]}"
