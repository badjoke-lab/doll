name: IMP-080 status integration

on:
  push:
    branches:
      - imp-080-ocr-image-writing-attachment

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp-080-ocr-image-writing-attachment
      - name: Apply IMP-080 status integration
        run: python scripts/imp080_status_integration_tmp.py
      - name: Regenerate combined specification
        run: python scripts/build_final_spec.py
      - name: Verify public status integration
        run: node scripts/check-public-site-status.mjs
      - name: Commit integrated status artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOLL_FINAL_SPEC.md docs/spec/09-development-roadmap.md docs/testing/phase-6-daily-use-matrix.json docs/implementation/imp-080-ocr-image-writing-attachment.md scripts/check-public-site-status.mjs website/project-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Integrate IMP-080 roadmap and status"
          git push origin HEAD:imp-080-ocr-image-writing-attachment
