name: IMP-070 mypy fix

on:
  pull_request:
    paths:
      - src/doll/local_portability_review.py
      - tests/test_imp_070_local_portability_review.py
      - .github/workflows/imp-070-mypy-log.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 224
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Apply strict typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path("src/doll/local_portability_review.py")
          text = module.read_text(encoding="utf-8")
          old = "outcome=cast(LocalPortabilityReviewOutcome, local_result.outcome),"
          new = "outcome=local_result.outcome,"
          if text.count(old) != 1:
              raise SystemExit("unexpected IMP-070 result typing shape")
          module.write_text(text.replace(old, new), encoding="utf-8")

          tests = Path("tests/test_imp_070_local_portability_review.py")
          text = tests.read_text(encoding="utf-8")
          old = '''        values = {
              "conversation_id": conversation_id,
              "scope_type": "conversation",
              "scope_key": "portability-review",
              "import_batch_id": fixture.import_batch_id,
              "request_text": "Review the import.",
              "operation_id": "imp070.duplicate.operation",
          }

          service.execute(**values)
          with pytest.raises(DuplicateConversationOperationError):
              service.execute(**values)'''
          new = '''        service.execute(
              conversation_id=conversation_id,
              scope_type="conversation",
              scope_key="portability-review",
              import_batch_id=fixture.import_batch_id,
              request_text="Review the import.",
              operation_id="imp070.duplicate.operation",
          )
          with pytest.raises(DuplicateConversationOperationError):
              service.execute(
                  conversation_id=conversation_id,
                  scope_type="conversation",
                  scope_key="portability-review",
                  import_batch_id=fixture.import_batch_id,
                  request_text="Review the import.",
                  operation_id="imp070.duplicate.operation",
              )'''
          if text.count(old) != 1:
              raise SystemExit("unexpected IMP-070 duplicate test shape")
          tests.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: >-
          uv run ruff format
          src/doll/local_portability_review.py
          tests/test_imp_070_local_portability_review.py
      - run: >-
          uv run ruff check
          src/doll/local_portability_review.py
          tests/test_imp_070_local_portability_review.py
      - run: uv run mypy --strict src tests
      - name: Commit typing fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doll/local_portability_review.py tests/test_imp_070_local_portability_review.py
          git diff --cached --check
          git commit -m "Fix IMP-070 strict typing"
          git push origin HEAD:${GITHUB_HEAD_REF}
