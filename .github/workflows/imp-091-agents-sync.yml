name: IMP-091 AGENTS sync

on:
  push:
    branches:
      - agent/imp-091

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-091
          fetch-depth: 0
      - name: Sync bounded implementation guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AGENTS.md")
          text = path.read_text(encoding="utf-8")

          def once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"expected one AGENTS match: {old[:80]!r}")
              text = text.replace(old, new)

          once(
              "IMP-001 through IMP-023 and IMP-030 through IMP-090 are complete on this implementation branch",
              "IMP-001 through IMP-023 and IMP-030 through IMP-091 are complete on this implementation branch",
          )
          imp090 = "- IMP-090 adds only a deterministic read-only consolidation-candidate detector over active non-secret confirmed memories. It reports exact duplicates, lexical near-duplicates, compatible extensions, and existing explicit contradiction links for review; it does not persist candidate state or merge, archive, supersede, update, or otherwise change authoritative MemoryRecord state automatically."
          imp091 = "- IMP-091 adds only an offline PAM v1.0 staged-memory adapter. It verifies required PAM content hashes, preserves exact source hashing and source metadata, and projects memory objects into the generic staged-import boundary as external data; it does not create confirmed MemoryRecords, local permissions, policy, instruction authority, PAM export, model behavior, embeddings, or network access."
          once(imp090, imp090 + "\n" + imp091)
          once(
              "Persistent memory-use signals, supported/default semantic retrieval, persistent embeddings, hybrid fusion, automatic context injection, PAM/PLUR/PROJECTMEM adapters, ProjectExperienceRecord, ContinuityPreflight, MCP, cloud expansion, and State Package signing are not established by IMP-090",
              "Persistent memory-use signals, supported/default semantic retrieval, persistent embeddings, hybrid fusion, automatic context injection, reviewed PAM publication/export, PLUR/PROJECTMEM adapters, ProjectExperienceRecord, ContinuityPreflight, MCP, cloud expansion, and State Package signing are not established by IMP-091",
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/imp-091-agents-sync.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add AGENTS.md .github/workflows/imp-091-agents-sync.yml
          git commit -m "Sync AGENTS through IMP-091"
          git push origin HEAD:agent/imp-091
