name: IMP-091 edge formatter

on:
  push:
    branches:
      - agent/imp-091

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-091
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Format edge validation tests
        shell: bash
        run: |
          uv run ruff format tests/test_imp_091_pam_v1_import_edges.py
          uv run ruff check tests/test_imp_091_pam_v1_import_edges.py
          rm .github/workflows/imp-091-edge-format.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add tests/test_imp_091_pam_v1_import_edges.py .github/workflows/imp-091-edge-format.yml
          git commit -m "IMP-091: format PAM edge validation tests"
          git push origin HEAD:agent/imp-091
