name: IMP-080 core apply

on:
  push:
    branches:
      - imp-080-ocr-image-writing-attachment

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp-080-ocr-image-writing-attachment
      - name: Apply bounded core patch
        run: python scripts/imp080_apply_tmp.py
      - name: Commit core patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doll/local_writing.py
          git diff --cached --quiet && exit 0
          git commit -m "Implement IMP-080 OCR image writing source core"
          git push origin HEAD:imp-080-ocr-image-writing-attachment
