name: IMP-096 clean copy

on:
  push:
    branches:
      - agent/imp-096-evidence-prep-clean
    paths:
      - .github/workflows/imp-096-clean-copy.yml

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-096-evidence-prep-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Copy validated IMP-096 preparation files only
        shell: bash
        run: |
          git fetch origin agent/imp-096-evidence-prep
          git checkout origin/agent/imp-096-evidence-prep -- \
            docs/testing/imp-096-primary-intel-mac-evidence-acceptance.md \
            scripts/validate_imp_096_lite_client_measurement.py \
            tests/test_imp_096_lite_client_measurement_evidence.py
          uv run ruff check scripts/validate_imp_096_lite_client_measurement.py tests/test_imp_096_lite_client_measurement_evidence.py
          uv run ruff format --check scripts/validate_imp_096_lite_client_measurement.py tests/test_imp_096_lite_client_measurement_evidence.py
          uv run mypy scripts/validate_imp_096_lite_client_measurement.py tests/test_imp_096_lite_client_measurement_evidence.py
          uv run pytest --no-cov -q tests/test_imp_083_lite_client_measurement.py tests/test_imp_096_lite_client_measurement_evidence.py
          rm .github/workflows/imp-096-clean-copy.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add docs/testing/imp-096-primary-intel-mac-evidence-acceptance.md scripts/validate_imp_096_lite_client_measurement.py tests/test_imp_096_lite_client_measurement_evidence.py .github/workflows/imp-096-clean-copy.yml
          git commit -m "IMP-096 prep: validate real-machine evidence contract"
          git push origin HEAD:agent/imp-096-evidence-prep-clean
