name: IMP-094 focused validation v3

on:
  push:
    branches:
      - agent/imp-094
    paths:
      - .github/workflows/imp-094-focused3.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-094
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Patch and validate IMP-094 focused suite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          experience = Path("src/doll/project_experience.py")
          replace_once(
              experience,
              "    safe_supersedes = _optional_uuid(\"supersedes experience ID\", supersedes_id)\n\n    if safe_kind == \"outcome\" and safe_outcome is None:\n",
              "    safe_supersedes = _optional_uuid(\"supersedes experience ID\", supersedes_id)\n\n    if sensitivity == \"secret\":\n        raise ProjectExperienceValidationError(\n            \"secret project experience content must use the existing SecretReference boundary\"\n        )\n    if safe_kind == \"outcome\" and safe_outcome is None:\n",
              "project-experience explicit secret rejection",
          )

          package = Path("src/doll/state_package.py")
          replace_once(
              package,
              "from doll.project_experience import _project_experience_from_record\n",
              "from doll.project_experience import (\n    ProjectExperienceCorruptError,\n    _project_experience_from_record,\n)\n",
              "project-experience package error import",
          )
          replace_once(
              package,
              "        ProcedureCorruptError,\n        ProjectDecisionCorruptError,\n",
              "        ProcedureCorruptError,\n        ProjectExperienceCorruptError,\n        ProjectDecisionCorruptError,\n",
              "project-experience package error wrapping",
          )

          tests = Path("tests/test_imp_094_project_experience.py")
          replace_once(
              tests,
              "from doll.project_experience import (\n    ProjectExperienceService,\n    ProjectExperienceValidationError,\n)\n",
              "from doll.project_experience import (\n    ProjectExperienceActor,\n    ProjectExperienceAssertionState,\n    ProjectExperienceEventKind,\n    ProjectExperienceOutcome,\n    ProjectExperienceService,\n    ProjectExperienceValidationError,\n)\n",
              "test experience type imports",
          )
          replace_once(
              tests,
              "from doll.project_state import ProjectService\n",
              "from doll.project_state import ProjectInfo, ProjectService\n",
              "test project info import",
          )
          replace_once(
              tests,
              "from doll.work_item import WorkItemService\n",
              "from doll.state_repository import StateRepository\nfrom doll.work_item import WorkItemInfo, WorkItemService\n",
              "test repository and work info imports",
          )
          replace_once(
              tests,
              "def _project(repository: state.StateRepository | object) -> object:\n    return ProjectService(repository).create_v2(  # type: ignore[arg-type]\n",
              "def _project(repository: StateRepository) -> ProjectInfo:\n    return ProjectService(repository).create_v2(\n",
              "test project helper typing",
          )
          replace_once(
              tests,
              "def _project_and_work(repository: object) -> tuple[object, object]:\n    project = _project(repository)\n    work = WorkItemService(repository).create(  # type: ignore[arg-type]\n        project_id=project.project_id,  # type: ignore[attr-defined]\n",
              "def _project_and_work(repository: StateRepository) -> tuple[ProjectInfo, WorkItemInfo]:\n    project = _project(repository)\n    work = WorkItemService(repository).create(\n        project_id=project.project_id,\n",
              "test project-work helper typing",
          )
          replace_once(
              tests,
              "        specifications = (\n",
              "        specifications: tuple[\n            tuple[\n                ProjectExperienceEventKind,\n                ProjectExperienceOutcome | None,\n                ProjectExperienceAssertionState,\n                ProjectExperienceActor,\n            ],\n            ...,\n        ] = (\n",
              "test literal tuple typing",
          )
          replace_once(
              tests,
              "        assert WorkItemService(repository).get(work.work_item_id).status == work_before.status\n",
              "        assert (\n            WorkItemService(repository).get(work.work_item_id).work_status\n            == work_before.work_status\n        )\n",
              "test work-status assertion",
          )
          old_secret_block = '''        secret_experience = service.record(\n            project_id=project.project_id,\n            event_kind="lesson",\n            summary="Synthetic secret experience content.",\n            occurred_at="2026-08-15T03:02:00Z",\n            assertion_state="user_recorded",\n            actor_type="user",\n            sensitivity="secret",\n        )\n        with pytest.raises(ProjectExperienceValidationError, match="excluded from normal export"):\n            service.export_json(secret_experience.experience_id)\n'''
          new_secret_block = '''        with pytest.raises(ProjectExperienceValidationError, match="SecretReference"):\n            service.record(\n                project_id=project.project_id,\n                event_kind="lesson",\n                summary="Synthetic secret experience content.",\n                occurred_at="2026-08-15T03:02:00Z",\n                assertion_state="user_recorded",\n                actor_type="user",\n                sensitivity="secret",\n            )\n'''
          replace_once(tests, old_secret_block, new_secret_block, "secret experience rejection test")
          old_resume_secret = '''        service.record(\n            project_id=project.project_id,\n            event_kind="lesson",\n            summary="Secret experience must not be counted or exposed.",\n            occurred_at="2026-08-15T06:01:00Z",\n            assertion_state="user_recorded",\n            actor_type="user",\n            sensitivity="secret",\n        )\n'''
          new_resume_sensitive = '''        service.record(\n            project_id=project.project_id,\n            event_kind="lesson",\n            summary="Sensitive experience is also omitted from Resume Bundle v1.",\n            occurred_at="2026-08-15T06:01:00Z",\n            assertion_state="user_recorded",\n            actor_type="user",\n            sensitivity="sensitive",\n        )\n'''
          replace_once(tests, old_resume_secret, new_resume_sensitive, "resume sensitive omission fixture")
          replace_once(
              tests,
              '    assert inspection.omitted_record_counts["project_experiences"] == 1\n',
              '    assert inspection.omitted_record_counts["project_experiences"] == 2\n',
              "resume omission count assertion",
          )
          replace_once(
              tests,
              '    assert manifest["omitted_record_counts"]["project_experiences"] == 1\n',
              '    assert manifest["omitted_record_counts"]["project_experiences"] == 2\n',
              "resume manifest omission count assertion",
          )
          replace_once(
              tests,
              '    assert b"Secret experience must not be counted" not in bundle_bytes\n',
              '    assert b"Sensitive experience is also omitted" not in bundle_bytes\n',
              "resume sensitive content assertion",
          )
          PY
          uv run ruff format src/doll/project_experience.py src/doll/state_package.py src/doll/resume_bundle.py tests/test_imp_094_project_experience.py
          uv run ruff check --fix src/doll/project_experience.py src/doll/state_package.py src/doll/resume_bundle.py tests/test_imp_094_project_experience.py
          uv run mypy src/doll/project_experience.py src/doll/state_package.py src/doll/resume_bundle.py tests/test_imp_094_project_experience.py
          uv run pytest --no-cov -q tests/test_imp_094_project_experience.py tests/test_state_package.py tests/test_backup.py tests/test_restore.py tests/test_resume_bundle.py
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/doll/project_experience.py src/doll/state_package.py tests/test_imp_094_project_experience.py
          git commit -m "IMP-094: validate project experience continuity behavior"
          git push origin HEAD:agent/imp-094
