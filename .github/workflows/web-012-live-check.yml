name: WEB-012 canonical live check

on:
  push:
    branches:
      - agent/web-012-live-check
    paths:
      - .github/workflows/web-012-live-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch canonical article
        shell: bash
        run: |
          set -euo pipefail
          URL='https://doll.badjoke-lab.com/notes/portable-memory-not-ai-continuity/'
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            -D headers.txt "$URL" -o article.html
          grep -F '<h1>Portable Memory Is Not AI Continuity: PAM, PLUR, PROJECTMEM, and doll</h1>' article.html
          grep -F 'https://portable-ai-memory.org/spec/v1.0/' article.html
          grep -F 'https://plur.ai/spec.html' article.html
          printf '%s\n' 'WEB-012_CANONICAL_LIVE=1'
          head -n 20 headers.txt
