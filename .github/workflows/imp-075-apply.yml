name: IMP-075 apply integration

on:
  pull_request:
    paths:
      - src/doll/local_csv.py
      - src/doll/local_csv_cli.py
      - tests/test_imp_075_local_csv.py
      - scripts/apply_imp_075.py
      - scripts/fix_imp_075_style.py
      - .github/workflows/imp-075-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 234
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run python scripts/apply_imp_075.py
      - run: uv run python scripts/fix_imp_075_style.py
      - run: >-
          uv run ruff check --fix
          src/doll/local_csv.py
          src/doll/local_csv_cli.py
          src/doll/cli.py
          tests/test_imp_075_local_csv.py
          tests/test_cli.py
      - run: >-
          uv run ruff format
          src/doll/local_csv.py
          src/doll/local_csv_cli.py
          src/doll/cli.py
          tests/test_imp_075_local_csv.py
          tests/test_cli.py
      - run: >-
          uv run ruff check
          src/doll/local_csv.py
          src/doll/local_csv_cli.py
          src/doll/cli.py
          tests/test_imp_075_local_csv.py
          tests/test_cli.py
      - run: uv run mypy src tests
      - run: >-
          uv run pytest --no-cov
          tests/test_imp_075_local_csv.py
          tests/test_cli.py
      - run: uv run python scripts/build_final_spec.py
      - run: node scripts/check-public-site-status.mjs
      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate IMP-075 local CSV workflows"
          git push origin HEAD:${GITHUB_HEAD_REF}
