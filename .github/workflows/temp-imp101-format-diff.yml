name: TEMP IMP-101 formatter diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Print formatter diff
        run: |
          uv run ruff format --diff tests/test_imp_101_primary_intel_mac_runtime_repeatability_evidence.py
