name: IMP-088 Ruff helper

on:
  push:
    branches:
      - agent/imp-088-ruff-helper

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-088-semantic-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Format validation tests
        run: |
          uv run ruff format tests/test_imp_088_semantic_candidate_validation.py
          uv run ruff check tests/test_imp_088_semantic_candidate_validation.py
          uv run ruff format --check tests/test_imp_088_semantic_candidate_validation.py
      - name: Commit target branch update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_imp_088_semantic_candidate_validation.py
          git diff --cached --check
          git commit -m "IMP-088: format semantic validation tests"
          git push origin HEAD:agent/imp-088-semantic-candidate
