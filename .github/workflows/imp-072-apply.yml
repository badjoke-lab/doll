name: IMP-072 apply integration

on:
  pull_request:
    paths:
      - tests/test_imp_072_doctor.py
      - .github/workflows/imp-072-apply.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.number == 228
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run python scripts/apply_imp_072.py
      - run: uv run python scripts/fix_imp_072_style.py
      - name: Run focused tests with JUnit
        id: focused
        continue-on-error: true
        run: >-
          uv run pytest --no-cov -q
          tests/test_imp_072_doctor.py
          tests/test_cli.py
          --junitxml=/tmp/imp-072.xml
      - name: Write bounded failure summary
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("/tmp/imp-072.xml").getroot()
          failures = []
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              failures.append({
                  "classname": case.attrib.get("classname", ""),
                  "name": case.attrib.get("name", ""),
                  "message": problem.attrib.get("message", "")[:1000],
              })
          Path("docs/testing/imp-072-junit-summary.json").write_text(
              json.dumps({"failure_count": len(failures), "failures": failures}, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("docs/testing/imp-072-debug-summary.txt").unlink(missing_ok=True)
          PY
      - name: Commit bounded JUnit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Capture bounded IMP-072 JUnit failures"
          git push origin HEAD:${GITHUB_HEAD_REF}
