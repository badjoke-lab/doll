name: IMP-072 apply integration

on:
  pull_request:
    paths:
      - scripts/apply_imp_072_immutable.py
      - .github/workflows/imp-072-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 228
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run python scripts/apply_imp_072_immutable.py
      - run: >-
          uv run ruff check --fix
          src/doll/state_db.py
          src/doll/state_schema.py
          src/doll/doctor.py
          src/doll/doctor_cli.py
          src/doll/cli.py
          tests/test_imp_072_doctor.py
          tests/test_cli.py
      - run: >-
          uv run ruff format
          src/doll/state_db.py
          src/doll/state_schema.py
          src/doll/doctor.py
          src/doll/doctor_cli.py
          src/doll/cli.py
          tests/test_imp_072_doctor.py
          tests/test_cli.py
      - run: >-
          uv run ruff check
          src/doll/state_db.py
          src/doll/state_schema.py
          src/doll/doctor.py
          src/doll/doctor_cli.py
          src/doll/cli.py
          tests/test_imp_072_doctor.py
          tests/test_cli.py
      - run: uv run mypy src
      - run: >-
          uv run pytest --no-cov
          tests/test_imp_072_doctor.py
          tests/test_cli.py
      - run: uv run python scripts/build_final_spec.py
      - run: node scripts/check-public-site-status.mjs
      - name: Remove temporary diagnostic files
        run: |
          rm -f docs/testing/imp-072-junit-summary.json
          rm -f docs/testing/imp-072-debug-summary.txt
      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use immutable read-only state for IMP-072 doctor"
          git push origin HEAD:${GITHUB_HEAD_REF}
