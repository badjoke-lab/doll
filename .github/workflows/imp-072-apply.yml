name: IMP-072 apply integration

on:
  pull_request:
    paths:
      - .github/workflows/imp-072-apply.yml

permissions:
  contents: write

jobs:
  summarize:
    if: github.event.pull_request.number == 228
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Extract bounded failure summary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("docs/testing/imp-072-debug.txt")
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          selected = lines[-500:]
          Path("docs/testing/imp-072-debug-summary.txt").write_text(
              "\n".join(selected) + "\n", encoding="utf-8"
          )
          source.unlink()
          PY
      - name: Commit bounded failure summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bound IMP-072 focused failure report"
          git push origin HEAD:${GITHUB_HEAD_REF}
