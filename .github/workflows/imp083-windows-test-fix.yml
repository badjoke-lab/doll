name: IMP-083 Windows parser test fix

on:
  push:
    branches:
      - imp-083-lite-client-resource-measurement

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp-083-lite-client-resource-measurement
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: python .github/imp083_windows_test_fix.py
      - run: uv run ruff format tests/test_imp_083_lite_client_measurement.py
      - run: uv run ruff check tests/test_imp_083_lite_client_measurement.py
      - run: uv run mypy tests/test_imp_083_lite_client_measurement.py
      - run: uv run pytest -q --no-cov tests/test_imp_083_lite_client_measurement.py
      - name: Commit Windows parser test fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_imp_083_lite_client_measurement.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix IMP-083 Windows parser acceptance"
          git push origin HEAD:imp-083-lite-client-resource-measurement
