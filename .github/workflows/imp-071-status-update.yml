name: IMP-071 status update

on:
  pull_request:
    paths:
      - scripts/apply_imp_071_status.py
      - .github/workflows/imp-071-status-update.yml

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.number == 226
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run python scripts/apply_imp_071_status.py
      - run: uv run python scripts/build_final_spec.py
      - run: node scripts/check-public-site-status.mjs
      - name: Normalize generated text
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/implementation/imp-071-structured-local-failure-guidance.md")
          text = path.read_text(encoding="utf-8")
          path.write_text(
              "\n".join(line.rstrip() for line in text.splitlines()) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit status updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record IMP-071 failure guidance CI status"
          git push origin HEAD:${GITHUB_HEAD_REF}
