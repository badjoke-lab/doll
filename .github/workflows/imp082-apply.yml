name: IMP-082 core apply

on:
  push:
    branches:
      - imp-082-multiple-writing-attachments

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp-082-multiple-writing-attachments
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Apply bounded multi-attachment core
        run: python .github/imp082_apply.py
      - run: uv run ruff format src/doll/local_writing.py
      - run: uv run ruff check src/doll/local_writing.py
      - run: uv run mypy src/doll/local_writing.py
      - name: Commit core implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doll/local_writing.py
          git diff --cached --quiet && exit 0
          git commit -m "Implement bounded multiple writing attachments"
          git push origin HEAD:imp-082-multiple-writing-attachments
