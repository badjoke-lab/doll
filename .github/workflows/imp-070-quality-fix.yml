name: IMP-070 quality fix

on:
  pull_request:
    paths:
      - src/doll/local_portability_review.py
      - tests/test_imp_070_local_portability_review.py
      - .github/workflows/imp-070-quality-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 224
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: >-
          uv run ruff check --fix
          src/doll/local_portability_review.py
          tests/test_imp_070_local_portability_review.py
      - run: >-
          uv run ruff format
          src/doll/local_portability_review.py
          tests/test_imp_070_local_portability_review.py
      - run: >-
          uv run ruff check
          src/doll/local_portability_review.py
          tests/test_imp_070_local_portability_review.py
      - name: Commit quality fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doll/local_portability_review.py tests/test_imp_070_local_portability_review.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix IMP-070 quality checks"
          git push origin HEAD:${GITHUB_HEAD_REF}
