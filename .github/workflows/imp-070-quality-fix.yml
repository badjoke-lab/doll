name: IMP-070 quality fix

on:
  pull_request:
    paths:
      - src/doll/local_portability_review.py
      - tests/test_imp_070_local_portability_review.py
      - .github/workflows/imp-070-quality-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 224
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Fix bounded test formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_imp_070_local_portability_review.py")
          text = path.read_text(encoding="utf-8")
          old = '''        assert all(description not in current[0]["content"] for description in fixture.linked_descriptions)'''
          new = '''        assert all(
              description not in current[0]["content"]
              for description in fixture.linked_descriptions
          )'''
          if text.count(old) != 1:
              raise SystemExit("unexpected IMP-070 assertion shape")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: >-
          uv run ruff format
          src/doll/local_portability_review.py
          tests/test_imp_070_local_portability_review.py
      - run: >-
          uv run ruff check
          src/doll/local_portability_review.py
          tests/test_imp_070_local_portability_review.py
      - name: Commit quality fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doll/local_portability_review.py tests/test_imp_070_local_portability_review.py
          git diff --cached --check
          git commit -m "Fix IMP-070 quality checks"
          git push origin HEAD:${GITHUB_HEAD_REF}
