name: IMP-070 quality fix

on:
  pull_request:
    paths:
      - src/doll/local_portability_review.py
      - tests/test_imp_070_local_portability_review.py
      - .github/workflows/imp-070-quality-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 224
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Capture Ruff findings
        run: |
          uv run ruff check --output-format concise \
            src/doll/local_portability_review.py \
            tests/test_imp_070_local_portability_review.py \
            > imp-070-ruff.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: imp-070-ruff-log
          path: imp-070-ruff.log
          if-no-files-found: error
