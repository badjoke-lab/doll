name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: imp-077-optional-local-image-ocr

      - name: Reconcile IMP-077 public status checks
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status_path = Path("website/project-status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          status["model_runtime"]["message"] = (
              "Phase 6 is in progress through IMP-077. Offline Ollama session import, explicit text-only loopback capture, the accepted bounded local-portability migration drill, the deterministic shutdown escape bundle, bounded ChatGPT selected-history import, imported-context replay with accepted primary Intel Mac evidence, bounded local draft/revise/summarize/translate workflows, explicit data-only context, bounded local work-item proposals, explicit local portability review, structured local runtime failure guidance, a deterministic read-only doll doctor, explicit local full-text state search, explicit local UTF-8 text and Markdown reading, explicit local CSV inspection and transformation, optional local PDF text extraction, and optional local image OCR are implemented. The IMP-063/IMP-064 writing workflow passes at both CI and real-machine evidence levels. IMP-076 uses an invocation-only in-process pypdf adapter; encrypted documents fail closed, pages without extractable text are reported without OCR, and no source overwrite, output file, persistence, model execution, process launch, network access, native-path disclosure, or automatic context injection occurs. IMP-077 recognizes bounded PNG/JPEG text through an invocation-only optional macOS Vision ocrmac adapter after standard-library source validation, with no process launch, network access, cloud access, automatic download, persistence, or automatic context injection. Attachment integration, accessibility presentation, Lite performance measurements, the release soak gate, semantic or automatic retrieval, cross-platform real OCR adapters, tools, the complete Phase 6 gate, Lite v1.0, target-specific application replacement, and stable general anti-lock-in remain incomplete."
          )
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          checker_path = Path("scripts/check-public-site-status.mjs")
          checker = checker_path.read_text(encoding="utf-8")
          checker = checker.replace(
              '    status.model_runtime.message.includes("optional local image OCR") &&\n    status.model_runtime.message.includes("macOS Vision") &&\n    status.model_runtime.message.includes("optional local image OCR") &&\n    status.model_runtime.message.includes("macOS Vision") &&',
              '    status.model_runtime.message.includes("optional local image OCR") &&\n    status.model_runtime.message.includes("macOS Vision") &&',
              1,
          )
          checker = checker.replace(
              'roadmap.includes("the next bounded implementation receives IMP-077 only when a new implementation issue is opened"),',
              'roadmap.includes("### IMP-077 — Optional local image OCR adapter") &&\n    roadmap.includes("the next bounded implementation receives IMP-078 only when a new implementation issue is opened"),',
              1,
          )
          checker = checker.replace(
              '"roadmap must identify IMP-077 as the next unallocated implementation identifier"',
              '"roadmap must record IMP-077 and identify IMP-078 as the next unallocated implementation identifier"',
              1,
          )
          checker_path.write_text(checker, encoding="utf-8")
          PY

          node scripts/check-public-site-status.mjs
          python scripts/build_final_spec.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/project-status.json scripts/check-public-site-status.mjs
          git commit -m "Reconcile IMP-077 public status checks"
          git push origin HEAD:imp-077-optional-local-image-ocr
