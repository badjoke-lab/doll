name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: imp-078-text-markdown-writing-attachments

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install project
        run: uv sync --dev --locked

      - name: Apply formatting
        run: uv run ruff format src/doll/local_writing.py tests/test_imp_078_text_markdown_writing_attachments.py

      - name: Verify lint
        run: uv run ruff check .

      - name: Commit formatting if changed
        shell: bash
        run: |
          git add src/doll/local_writing.py tests/test_imp_078_text_markdown_writing_attachments.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format IMP-078 attachment integration"
          git push origin HEAD:imp-078-text-markdown-writing-attachments
