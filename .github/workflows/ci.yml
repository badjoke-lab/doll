name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  imp070_fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 224
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Apply strict typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path("src/doll/local_portability_review.py")
          text = module.read_text(encoding="utf-8")
          old = "outcome=cast(LocalPortabilityReviewOutcome, local_result.outcome),"
          if text.count(old) != 1:
              raise SystemExit("unexpected IMP-070 result typing shape")
          module.write_text(
              text.replace(old, "outcome=local_result.outcome,"),
              encoding="utf-8",
          )

          tests = Path("tests/test_imp_070_local_portability_review.py")
          text = tests.read_text(encoding="utf-8")
          function_start = text.index(
              "def test_duplicate_operation_creates_no_second_review_context"
          )
          block_start = text.index("        values = {\n", function_start)
          second_call = text.index(
              "            service.execute(**values)\n",
              block_start,
          )
          block_end = second_call + len("            service.execute(**values)\n")
          replacement = '''        service.execute(
              conversation_id=conversation_id,
              scope_type="conversation",
              scope_key="portability-review",
              import_batch_id=fixture.import_batch_id,
              request_text="Review the import.",
              operation_id="imp070.duplicate.operation",
          )
          with pytest.raises(DuplicateConversationOperationError):
              service.execute(
                  conversation_id=conversation_id,
                  scope_type="conversation",
                  scope_key="portability-review",
                  import_batch_id=fixture.import_batch_id,
                  request_text="Review the import.",
                  operation_id="imp070.duplicate.operation",
              )
'''
          tests.write_text(
              text[:block_start] + replacement + text[block_end:],
              encoding="utf-8",
          )
          PY
      - run: >-
          uv run ruff format
          src/doll/local_portability_review.py
          tests/test_imp_070_local_portability_review.py
      - run: >-
          uv run ruff check
          src/doll/local_portability_review.py
          tests/test_imp_070_local_portability_review.py
      - run: uv run mypy src tests
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/doll/local_portability_review.py tests/test_imp_070_local_portability_review.py
          git diff --cached --check
          git commit -m "Fix IMP-070 strict typing"
          git push origin HEAD:${GITHUB_HEAD_REF}

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install project
        run: uv sync --dev --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Check generated specification
        run: uv run python scripts/build_final_spec.py --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --dev --locked

      - name: Run tests
        run: uv run python scripts/run_ci_tests.py

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ runner.os }}
          path: pytest-output.txt
          if-no-files-found: error

      - name: Check CLI help
        run: uv run doll --help

      - name: Check module CLI help
        run: uv run python -m doll --help
