name: IMP-092 preparation

on:
  push:
    branches:
      - agent/imp-092

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-092
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Apply bounded type and guidance updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match for {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          once(
              "src/doll/pam_v1_publication.py",
              "        staged, source_mapping, pam_memory = _candidate(stage_result, source_memory_id)\n",
              "        source_mapping, pam_memory = _candidate(stage_result, source_memory_id)\n",
          )
          once(
              "src/doll/pam_v1_publication.py",
              "def _candidate(\n    stage_result: PamV1ImportStageResult,\n    source_memory_id: str,\n):\n",
              "def _candidate(\n    stage_result: PamV1ImportStageResult,\n    source_memory_id: str,\n) -> tuple[PamV1MemoryMapping, dict[str, object]]:\n",
          )
          once(
              "src/doll/pam_v1_publication.py",
              "    return staged, source_mapping, cast(dict[str, object], pam_memory)\n",
              "    return source_mapping, cast(dict[str, object], pam_memory)\n",
          )
          once(
              "tests/test_imp_092_pam_v1_publication.py",
              "    PAM_V1_ENVIRONMENT_CLASS,\n    PamV1ImportStager,\n",
              "    PAM_V1_ENVIRONMENT_CLASS,\n    PamV1ImportStageResult,\n    PamV1ImportStager,\n",
          )
          once(
              "tests/test_imp_092_pam_v1_publication.py",
              "def _stage(\n    source_bytes: bytes,\n    source_environment: SourceEnvironmentRecord,\n):\n",
              "def _stage(\n    source_bytes: bytes,\n    source_environment: SourceEnvironmentRecord,\n) -> PamV1ImportStageResult:\n",
          )
          once(
              "AGENTS.md",
              "IMP-001 through IMP-023 and IMP-030 through IMP-091 are complete on this implementation branch",
              "IMP-001 through IMP-023 and IMP-030 through IMP-092 are complete on this implementation branch",
          )
          imp091 = "- IMP-091 adds only an offline PAM v1.0 staged-memory adapter. It verifies required PAM content hashes, preserves exact source hashing and source metadata, and projects memory objects into the generic staged-import boundary as external data; it does not create confirmed MemoryRecords, local permissions, policy, instruction authority, PAM export, model behavior, embeddings, or network access."
          imp092 = "- IMP-092 adds only explicit candidate-by-candidate PAM memory review and publication. Read-only previews bind the exact source and current state to an approve/reject plan hash; only a user-controlled approve may create a normal approved-import MemoryRecord, unchanged repeated approval reuses it, rejection writes nothing, and PAM lifecycle/access/confidence/relations/instruction/embedding metadata remain non-authoritative."
          once("AGENTS.md", imp091, imp091 + "\n" + imp092)
          once(
              "AGENTS.md",
              "reviewed PAM publication/export, PLUR/PROJECTMEM adapters",
              "PAM export, PLUR/PROJECTMEM adapters",
          )
          once(
              "AGENTS.md",
              "are not established by IMP-091 and must follow",
              "are not established by IMP-092 and must follow",
          )
          PY
          uv run ruff check --fix --select I src/doll/pam_v1_publication.py tests/test_imp_092_pam_v1_publication.py
          uv run ruff format src/doll/pam_v1_publication.py tests/test_imp_092_pam_v1_publication.py
          uv run ruff check src/doll/pam_v1_publication.py tests/test_imp_092_pam_v1_publication.py
          uv run mypy src/doll/pam_v1_publication.py tests/test_imp_092_pam_v1_publication.py
          rm .github/workflows/imp-092-prep.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add AGENTS.md src/doll/pam_v1_publication.py tests/test_imp_092_pam_v1_publication.py .github/workflows/imp-092-prep.yml
          git commit -m "IMP-092: prepare reviewed PAM publication slice"
          git push origin HEAD:agent/imp-092
