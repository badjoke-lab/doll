name: IMP-078 status integration

on:
  push:
    branches:
      - imp-078-text-markdown-writing-attachments

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: imp-078-text-markdown-writing-attachments

      - name: Prepare IMP-077 checker marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/check-public-site-status.mjs")
          text = path.read_text(encoding="utf-8")
          label = '  "IMP-077 local image OCR must remain optional, bounded, untrusted, local-only, and CI-only",\n);\n'
          if label not in text:
              marker = '  "IMP-076 local PDF extraction must remain optional, untrusted, local-only, and CI-only",\n);\n'
              block = '''\n\nexpect(\n  dailyUse.local_ocr_extension?.implementation === "IMP-077" &&\n    dailyUse.local_ocr_extension?.status === "ci-pass" &&\n    dailyUse.local_ocr_extension?.adapter_optional === true &&\n    dailyUse.local_ocr_extension?.adapter_id === "ocrmac-vision" &&\n    dailyUse.local_ocr_extension?.adapter_platform === "darwin" &&\n    dailyUse.local_ocr_extension?.real_adapter_hosted_ci === true &&\n    dailyUse.local_ocr_extension?.primary_intel_mac_real_machine_evidence === false &&\n    dailyUse.local_ocr_extension?.process_launch === false &&\n    dailyUse.local_ocr_extension?.network_access === false &&\n    dailyUse.local_ocr_extension?.cloud_access === false &&\n    dailyUse.local_ocr_extension?.automatic_download === false &&\n    dailyUse.local_ocr_extension?.authority_class === "untrusted_data" &&\n    dailyUse.local_ocr_extension?.phase6_gate_complete === false &&\n    dailyUse.local_ocr_extension?.lite_v1_complete === false &&\n    dailyUse.local_ocr_extension?.stable_anti_lock_in_claim === false,\n  "IMP-077 local image OCR must remain optional, bounded, untrusted, local-only, and CI-only",\n);\n'''
              if marker not in text:
                  raise SystemExit("IMP-076 checker marker missing")
              text = text.replace(marker, marker + block, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Apply status integration
        run: python scripts/imp078_status_integration_tmp.py

      - name: Regenerate combined specification
        run: python scripts/build_final_spec.py

      - name: Verify public status
        run: node scripts/check-public-site-status.mjs

      - name: Commit generated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOLL_FINAL_SPEC.md docs/spec/09-development-roadmap.md docs/testing/phase-6-daily-use-matrix.json scripts/check-public-site-status.mjs website/project-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Integrate IMP-078 roadmap and status"
          git push origin HEAD:imp-078-text-markdown-writing-attachments
