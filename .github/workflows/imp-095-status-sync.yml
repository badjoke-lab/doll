name: IMP-095 status sync

on:
  push:
    branches:
      - agent/imp-095-status-sync
    paths:
      - .github/workflows/imp-095-status-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-095-status-sync
      - name: Advance public status through IMP-095
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          status = Path("website/project-status.json")
          replace_once(status, '"next_implementation": 95', '"next_implementation": 96', "next implementation")
          replace_once(status, 'Phase 6 is in progress through IMP-094.', 'Phase 6 is in progress through IMP-095.', "frontier")
          anchor = (
              'MCON-009 is covered, including a failed attempt and later resolution, while experience-aware action blocking remains '
              'out of scope until ContinuityPreflight. '
          )
          paragraph = (
              'IMP-095 adds the first bounded deterministic ContinuityPreflight read model over explicit accepted project/action '
              'scope. It runs only against a read-only repository and composes caller-classified active policy denials, current '
              'WorkItem blockers and incomplete dependencies, explicitly required Procedure state, immutable capability risk/release '
              'metadata, PermissionRecord resolution, and directly relevant unsuperseded failed ProjectExperienceRecord warnings into '
              'explainable matched record IDs, rule codes, authoritative blocker IDs, and confirmation requirements. It does not '
              'interpret PolicyRecord prose, grant execution authority, execute capabilities, consume permissions, mutate Doll State, '
              'or let imported/model-proposed experience create a hard denial; the existing Capability Broker remains the execution '
              'authorization boundary. MCON-011 through MCON-013 pass with deterministic synthetic evidence. '
          )
          replace_once(status, anchor, anchor + paragraph, "IMP-095 status paragraph")
          replace_once(status, 'PLUR/PROJECTMEM adapters, ContinuityPreflight, MCP,', 'PLUR/PROJECTMEM adapters, MCP,', "remove completed preflight")

          checker = Path("scripts/check-public-site-status.mjs")
          replace_once(checker, 'status.phase?.next_implementation === 95,', 'status.phase?.next_implementation === 96,', "checker next implementation")
          replace_once(checker, '"project-status.json must mark Phase 6 in progress through IMP-094 with IMP-095 next",', '"project-status.json must mark Phase 6 in progress through IMP-095 with IMP-096 next",', "checker frontier message")
          replace_once(checker, 'status.model_runtime.message.includes("through IMP-094") &&', 'status.model_runtime.message.includes("through IMP-095") &&', "checker runtime frontier")
          imp094_anchor = '    status.model_runtime.message.includes("experience-aware action blocking remains out of scope until ContinuityPreflight") &&\n'
          imp095_checks = (
              '    status.model_runtime.message.includes("bounded deterministic ContinuityPreflight read model") &&\n'
              '    status.model_runtime.message.includes("read-only repository") &&\n'
              '    status.model_runtime.message.includes("caller-classified active policy denials") &&\n'
              '    status.model_runtime.message.includes("WorkItem blockers and incomplete dependencies") &&\n'
              '    status.model_runtime.message.includes("explicitly required Procedure state") &&\n'
              '    status.model_runtime.message.includes("immutable capability risk/release metadata") &&\n'
              '    status.model_runtime.message.includes("PermissionRecord resolution") &&\n'
              '    status.model_runtime.message.includes("unsuperseded failed ProjectExperienceRecord warnings") &&\n'
              '    status.model_runtime.message.includes("does not interpret PolicyRecord prose") &&\n'
              '    status.model_runtime.message.includes("existing Capability Broker remains the execution authorization boundary") &&\n'
              '    status.model_runtime.message.includes("MCON-011 through MCON-013") &&\n'
          )
          replace_once(checker, imp094_anchor, imp094_anchor + imp095_checks, "checker IMP-095 assertions")
          replace_once(checker, '"project-status.json must describe IMP-094 while preserving bounded IMP-083 through IMP-093 evidence and non-claims",', '"project-status.json must describe IMP-095 while preserving bounded IMP-083 through IMP-094 evidence and non-claims",', "checker description")
          PY
          node scripts/check-public-site-status.mjs
          rm .github/workflows/imp-095-status-sync.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add website/project-status.json scripts/check-public-site-status.mjs .github/workflows/imp-095-status-sync.yml
          git commit -m "Sync public status through IMP-095"
          git push origin HEAD:agent/imp-095-status-sync
