name: IMP-091 fixture fix

on:
  push:
    branches:
      - agent/imp-091

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-091
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Preserve invalid raw content type in fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_imp_091_pam_v1_import_edges.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _memory(**overrides: object) -> dict[str, object]:
    content = str(overrides.pop("content", "Local memory text."))
    values: dict[str, object] = {
        "id": "memory-a",
        "type": "fact",
        "content": content,
        "content_hash": pam.pam_content_hash(content),
'''
          new = '''def _memory(**overrides: object) -> dict[str, object]:
    content = overrides.pop("content", "Local memory text.")
    hash_content = content if isinstance(content, str) else "Local memory text."
    values: dict[str, object] = {
        "id": "memory-a",
        "type": "fact",
        "content": content,
        "content_hash": pam.pam_content_hash(hash_content),
'''
          if text.count(old) != 1:
              raise SystemExit("expected one _memory fixture block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format tests/test_imp_091_pam_v1_import_edges.py
          uv run ruff check tests/test_imp_091_pam_v1_import_edges.py
          rm .github/workflows/imp-091-fixture-fix.yml
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add tests/test_imp_091_pam_v1_import_edges.py .github/workflows/imp-091-fixture-fix.yml
          git commit -m "IMP-091: preserve invalid PAM field types in tests"
          git push origin HEAD:agent/imp-091
