name: IMP-070 format artifact v2

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.number == 224
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: uv run ruff format src/doll/local_portability_review.py tests/test_imp_070_local_portability_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: imp-070-formatted-v2
          path: |
            src/doll/local_portability_review.py
            tests/test_imp_070_local_portability_review.py
          if-no-files-found: error
