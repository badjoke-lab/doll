name: TEMP IMP-102 format

on:
  push:
    branches:
      - agent/imp-102-lite-install-storage-prep

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/imp-102-lite-install-storage-prep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - name: Format IMP-102 files
        run: |
          uv run ruff format \
            scripts/run_imp_102_lite_install_storage_measurement.py \
            scripts/validate_imp_102_lite_install_storage_measurement.py \
            tests/test_imp_102_lite_install_storage_measurement.py
          uv run ruff check --fix \
            scripts/run_imp_102_lite_install_storage_measurement.py \
            scripts/validate_imp_102_lite_install_storage_measurement.py \
            tests/test_imp_102_lite_install_storage_measurement.py
          rm .github/workflows/tmp-imp102-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format IMP-102 measurement slice"
          git push origin HEAD:agent/imp-102-lite-install-storage-prep
