name: IMP-082 coverage fix

on:
  push:
    branches:
      - imp-082-multiple-writing-attachments

permissions:
  contents: write

jobs:
  coverage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp-082-multiple-writing-attachments
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev --locked
      - run: python .github/imp082_coverage_fix.py
      - run: uv run ruff format tests/test_imp_082_multiple_writing_attachments.py
      - run: uv run ruff check tests/test_imp_082_multiple_writing_attachments.py
      - run: uv run mypy tests/test_imp_082_multiple_writing_attachments.py
      - run: uv run pytest -q --no-cov tests/test_imp_082_multiple_writing_attachments.py
      - name: Commit coverage acceptance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_imp_082_multiple_writing_attachments.py
          git diff --cached --quiet && exit 0
          git commit -m "Cover IMP-082 attachment validation branches"
          git push origin HEAD:imp-082-multiple-writing-attachments
